# Set default shell to zsh
set-option -g default-shell /usr/bin/zsh

# Start window and pane indexing at 1
set -g base-index 1
setw -g pane-base-index 1

# Ctrl+number selects the matching window; Ctrl+0 returns to the previous one.
bind-key -n C-1 select-window -t :=1
bind-key -n C-2 select-window -t :=2
bind-key -n C-3 select-window -t :=3
bind-key -n C-4 select-window -t :=4
bind-key -n C-5 select-window -t :=5
bind-key -n C-6 select-window -t :=6
bind-key -n C-7 select-window -t :=7
bind-key -n C-8 select-window -t :=8
bind-key -n C-9 select-window -t :=9
bind-key -n C-0 last-window

# Open the window, session, and pane chooser.
bind-key Tab choose-tree -Z
bind-key -n C-Tab choose-tree -Z

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir ~/.tmux/resurrect
set -g mouse on
set -s extended-keys on

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Spotlight command palette and file search.
if-shell 'test -x "$HOME/.sh/spotlight/bin/spotlight"' {
    bind-key -n C-Space run-shell '~/.sh/spotlight/bin/spotlight --popup'
    bind-key -n C-p run-shell '~/.sh/spotlight/bin/spotlight --popup --files'
}
