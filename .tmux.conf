# Set default shell to zsh
set-option -g default-shell /usr/bin/zsh

# Start window and pane indexing at 1
set -g base-index 1
setw -g pane-base-index 1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir ~/.tmux/resurrect
set -g mouse on
set -s extended-keys on

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'



set -g prefix C-b
bind C-b send-prefix

bind-key -n C-Space display-popup -E \
  -w 85% -h 70% \
  -T " TMUX COMMAND CENTER " \
  -s "bg=#161b22,fg=#d5dce4" \
  -S "fg=#7dd3a8" \
  "~/.sh/scripts/tmux-palette2"

bind-key -n C-p display-popup -E \
  -w 85% -h 70% \
  -T " FILE SEARCH " \
  -s "bg=#161b22,fg=#d5dce4" \
  -S "fg=#7dd3a8" \
  "~/.sh/scripts/tmux-palette2 --files"

# The chooser includes sessions, windows, and panes. Enter selects; Escape cancels.
# Konsole Keyboard profile: Tab+Ctrl-Shift -> \E[27;5;9~
# C-Tab needs a terminal that sends it distinctly from Tab; prefix Tab works everywhere.
bind-key Tab choose-tree -Z
bind-key -n C-Tab choose-tree -Z
bind-key -T copy-mode C-Tab send-keys -X cursor-down
bind-key -T copy-mode-vi C-Tab send-keys -X cursor-down
