# Set default shell to zsh
set-option -g default-shell /usr/bin/zsh

# Start window and pane indexing at 1
set -g base-index 1
setw -g pane-base-index 1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir ~/.tmux/resurrect
set -g mouse on

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Spotlight command palette and file search.
if-shell 'test -x "$HOME/.sh/spotlight/bin/spotlight"' {
    bind-key -n C-Space run-shell '~/.sh/spotlight/bin/spotlight --popup'
    bind-key -n C-p run-shell '~/.sh/spotlight/bin/spotlight --popup --files'
}
